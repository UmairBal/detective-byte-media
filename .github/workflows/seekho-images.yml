name: seekho-images

on:
  push:
    paths:
      - "seekho/gen/prompts.json"
      - "seekho/gen/generate.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seekho-images
  cancel-in-progress: true

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-rv51-lcm-v1
      - name: Install
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet diffusers==0.31.0 transformers==4.46.3 accelerate peft safetensors pillow
      - name: Generate
        run: python seekho/gen/generate.py --shard ${{ matrix.shard }} --of 9 --out out
      - uses: actions/upload-artifact@v4
        with:
          name: img-${{ matrix.shard }}
          path: out/

  commit:
    needs: gen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: img-*
          merge-multiple: true
          path: seekho/images
      - name: Commit images
        run: |
          git config user.name "seekho-bot"
          git config user.email "seekho-bot@users.noreply.github.com"
          git add seekho/images
          git commit -m "Add Seekho Sitara story images" || echo "nothing to commit"
          git pull --rebase origin main
          git push
